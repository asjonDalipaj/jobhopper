name: access admin

# One-off administration for Cloudflare Access, run manually with the
# CLOUDFLARE_API_TOKEN secret. Requires Access: Apps and Policies: Edit.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list applications, list one app’s policies, or delete an app'
        type: choice
        options: [list, policies, delete]
        default: list
      app_id:
        description: 'Access application id (required for policies/delete)'
        required: false
      confirm:
        description: 'type DELETE to confirm deleting the application'
        required: false

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List applications
        if: inputs.action == 'list'
        run: |
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps" \
            | jq '{success, errors, apps: [.result[] | {id,name,domain,type,created_at}]}'

      - name: List policies for one application
        if: inputs.action == 'policies'
        run: |
          if [ -z "${{ inputs.app_id }}" ]; then echo "app_id is required"; exit 1; fi
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps/${{ inputs.app_id }}/policies" \
            | jq '{success, errors, policies: [.result[] | {id,name,decision,precedence,include,require,exclude}]}'

      - name: Delete the application
        if: inputs.action == 'delete'
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then echo "confirm must be DELETE"; exit 1; fi
          if [ -z "${{ inputs.app_id }}" ]; then echo "app_id is required"; exit 1; fi
          echo "backup before delete:"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps/${{ inputs.app_id }}" \
            | jq '{success, errors, app: .result}'
          code=$(curl -sS -o /tmp/delete.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps/${{ inputs.app_id }}")
          echo "delete HTTP $code"
          cat /tmp/delete.json | jq .
          [ "$code" = "200" ]
