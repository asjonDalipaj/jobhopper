name: discover boards

# Monthly refresh of the Italian/Spanish/Dutch company index from the open
# JobHive dataset. Produces a reviewed candidate list; it never edits
# companies.ts or the snapshot.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-boards
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --quiet duckdb

      - name: Import dataset rows
        run: python scripts/import-boards.py --countries IT,ES,NL

      - name: Probe live boards
        run: node scripts/probe-boards.mjs

      - name: Commit candidate report
        run: |
          git config user.name "jobhopper-bot"
          git config user.email "jobhopper-bot@users.noreply.github.com"
          git add .jobhopper/exports/board-candidates.json .jobhopper/exports/board-candidates.md
          if git diff --cached --quiet; then
            echo "no candidate changes"
            exit 0
          fi
          git commit -m "chore(boards): refresh candidate report"
          git push
