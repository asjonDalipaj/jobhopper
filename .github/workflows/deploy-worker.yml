name: deploy dispatch worker

# Deploys the Cloudflare Worker that dispatches the scan every 3 hours.
# Reuses the same Cloudflare credentials as the Pages deploy, plus a fine-grained
# GitHub PAT stored as the GH_DISPATCH_TOKEN repository secret.
on:
  push:
    branches: [main]
    paths:
      - 'workers/dispatch-scan/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy worker
        working-directory: workers/dispatch-scan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx --yes wrangler@3 deploy

      - name: Set the GitHub dispatch token
        working-directory: workers/dispatch-scan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_DISPATCH_TOKEN" ]; then
            echo "::warning::GH_DISPATCH_TOKEN is not set. The worker is deployed but its cron cannot dispatch until the secret is added; re-run this workflow afterwards."
            exit 0
          fi
          printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@3 secret put GITHUB_DISPATCH_TOKEN
          echo "Worker secret GITHUB_DISPATCH_TOKEN set."
