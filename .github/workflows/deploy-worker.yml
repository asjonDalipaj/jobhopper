name: deploy dispatch worker

# Deploys the Cloudflare Worker that dispatches the scan every 3 hours.
# wrangler reads the [triggers] cron and [vars] from wrangler.toml; the GitHub
# PAT is pushed as a Worker secret from the GH_DISPATCH_TOKEN repository secret.
on:
  push:
    branches: [main]
    paths:
      - 'workers/dispatch-scan/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy worker (code + cron)
        working-directory: workers/dispatch-scan
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx --yes wrangler@3 deploy

      - name: Set the GitHub dispatch token
        if: env.GH_DISPATCH_TOKEN != ''
        working-directory: workers/dispatch-scan
        run: |
          set -euo pipefail
          printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@3 secret put GITHUB_DISPATCH_TOKEN

      - name: Show the worker URL
        run: |
          sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // empty')
          if [ -n "$sub" ]; then
            echo "worker health: https://jobhopper-dispatch.$sub.workers.dev/health"
          fi
