name: scheduled job scan

# Runs jobhopper on GitHub's free servers, so it keeps finding jobs even when
# your laptop is off. Frequency is "every 3 hours". Each run fetches fresh
# postings and commits the rendered HTML dashboards (.jobhopper/exports/*.html).
# The SQLite DB is NOT committed (too large + local-only); it is rebuilt fresh
# on each runner and discarded when the job ends.
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch: {}      # also allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # CI works in the repo at ./.jobhopper so the generated HTML dashboards
      # land there and get committed. The CLI is invoked via the built entry
      # point (no global install needed).
      - name: Scan + run jobs
        env:
          JOBHOPPER_HOME: ${{ github.workspace }}/.jobhopper
        run: |
          node dist/cli/index.js scan -a --verify
          node dist/cli/index.js run --no-judge

      # Optional AI judging on the schedule: uncomment, and add an
      # OPENROUTER_API_KEY secret under Settings -> Secrets and variables.
      # - name: Judge results (optional)
      #   env:
      #     JOBHOPPER_HOME: ${{ github.workspace }}/.jobhopper
      #     OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      #   run: node dist/cli/index.js run

      - name: Commit dashboards
        run: |
          git config user.name "jobhopper-bot"
          git config user.email "actions@github.com"
          git add .jobhopper
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh jobhopper dashboards"
            git push
          fi