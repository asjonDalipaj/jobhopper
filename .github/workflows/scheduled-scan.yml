name: scheduled job scan

# Runs jobhopper on GitHub's free servers, so it keeps finding jobs even when
# your laptop is off. Frequency is "every 3 hours". Each run fetches fresh
# postings, judges the "eu-recent-software" (EU work) tab, and commits the JSON
# snapshot (.jobhopper/exports/jobs.json) + HTML dashboards. Verdicts are read
# in the React UI, which is served from the JSON snapshot - that is the single
# verdict surface.
# The SQLite DB is NOT committed (too large + local-only); it is rebuilt fresh
# on each runner and discarded when the job ends.
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch: {}      # also allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # CI works in the repo at ./.jobhopper so the generated HTML dashboards
      # land there and get committed. The CLI is invoked via the built entry
      # point (no global install needed).
      - name: Scan + run jobs
        env:
          JOBHOPPER_HOME: ${{ github.workspace }}/.jobhopper
        run: |
          node dist/cli/index.js scan -a --verify
          # -j writes the committed JSON snapshot (jobs.json) for the React UI.
          node dist/cli/index.js run -j .jobhopper/exports/jobs.json

      # Judge the EU work tab against the committed profile (cv.txt / preferences
      # / constraints under .jobhopper/profile/). Verdicts are surfaced in the
      # React UI via the committed jobs.json snapshot — that is the single place
      # to read verdicts (the static HTML dashboards don't carry verdicts).
      # Add an OPENROUTER_API_KEY secret under Settings -> Secrets and variables.
      # When it is present this:
      #   1. judges every posting in the "eu-recent-software" tab (the broad
      #      "Recent EU software roles" view) with the quick model, and
      #   2. re-exports so those verdicts land in the committed JSON snapshot.
      # Without the secret the step simply no-ops.
      - name: Judge EU work tab (if key set)
        env:
          JOBHOPPER_HOME: ${{ github.workspace }}/.jobhopper
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "OpenRouter key reached this step (${#OPENROUTER_API_KEY} chars) - judging EU work tab..."
            node dist/cli/index.js judge --tab eu-recent-software --quick
            node dist/cli/index.js run -j .jobhopper/exports/jobs.json
          else
            echo "No OpenRouter API key reached this step - skipping judgment."
            echo "Check Settings -> Secrets and variables -> Actions:"
            echo "  - the secret must be named exactly OPENROUTER_API_KEY"
            echo "  - it must be a REPOSITORY secret (not only an environment secret, unless the job sets environment:)"
            echo "  - scheduled runs on the default branch see repo/org secrets; a run started before you saved it won't have it"
          fi

      - name: Commit dashboards
        run: |
          git config user.name "jobhopper-bot"
          git config user.email "actions@github.com"
          git add .jobhopper
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh jobhopper dashboards"
            git push
          fi
