name: scheduled job scan

# Runs jobhopper on GitHub's free servers, so it keeps finding jobs even when
# your laptop is off. Frequency is "every 3 hours". Each run fetches fresh
# postings and commits the rendered HTML dashboards (.jobhopper/exports/*.html).
# The SQLite DB is NOT committed (too large + local-only); it is rebuilt fresh
# on each runner and discarded when the job ends.
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch: {}      # also allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # CI works in the repo at ./.jobhopper so the generated HTML dashboards
      # land there and get committed. The CLI is invoked via the built entry
      # point (no global install needed).
      - name: Scan + run jobs
        env:
          JOBHOPPER_HOME: ${{ github.workspace }}/.jobhopper
        run: |
          node dist/cli/index.js scan -a --verify
          # -j writes the committed JSON snapshot (jobs.json) for the React UI.
          node dist/cli/index.js run -j .jobhopper/exports/jobs.json

      # Judge the most recently posted postings against the committed profile
      # (cv.txt / preferences / constraints under .jobhopper/profile/).
      # Add an OPENROUTER_API_KEY secret under Settings -> Secrets and
      # variables. When it is present this:
      #   1. judges the newest postings (listJobs is ordered posted_at DESC, so
      #      `--all --limit 20` covers the 20 most recent unjudged rows), and
      #   2. re-exports so those verdicts land in the committed JSON snapshot.
      # Without the secret the step simply no-ops.
      - name: Judge latest postings (if key set)
        env:
          JOBHOPPER_HOME: ${{ github.workspace }}/.jobhopper
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            node dist/cli/index.js judge --all --quick --limit 20
            node dist/cli/index.js run -j .jobhopper/exports/jobs.json
          else
            echo "No OPENROUTER_API_KEY; skipping judgment this run."
          fi

      - name: Commit dashboards
        run: |
          git config user.name "jobhopper-bot"
          git config user.email "actions@github.com"
          git add .jobhopper
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh jobhopper dashboards"
            git push
          fi
