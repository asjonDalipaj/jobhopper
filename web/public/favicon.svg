<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="JobHopper — a hermit crab carrying a briefcase">
  <circle cx="32" cy="33" r="20.5" fill="#FFC53D"/>

  <!-- bent crab legs, under the shell -->
  <g fill="none" stroke="#111111" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26.4 43C24.4 45 23.2 46.6 22.6 48.8"/>
    <path d="M32 43.4C32 45.6 31.8 47 31.4 48.8"/>
    <path d="M37.6 43C39.6 45 40.8 46.6 41.4 48.8"/>
  </g>

  <!-- eyes on short stalks, peeking over the case -->
  <g fill="none" stroke="#111111" stroke-width="2.9" stroke-linecap="round">
    <path d="M25 27.4 24.6 23.6"/>
    <path d="M39 27.4 39.4 23.8"/>
  </g>
  <circle cx="24.6" cy="22.8" r="2.3" fill="#111111"/>
  <circle cx="39.4" cy="23" r="2.3" fill="#111111"/>

  <!-- the briefcase is the shell -->
  <g transform="rotate(-5 32 34.5)">
    <rect x="21" y="26.4" width="22" height="16.6" rx="3.2" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <path d="M28.4 26.4v-2.3a2.3 2.3 0 0 1 2.3-2.3h2.6a2.3 2.3 0 0 1 2.3 2.3v2.3" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    <path d="M21.4 34.7h21.2" fill="none" stroke="#111111" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M32 33v3.2" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- pincers -->
  <path d="M12.46 38.11A4.0 4.0 0 1 1 15.03 42.56L14.18 40.08Z" fill="#111111"/>
  <path d="M48.97 42.56A4.0 4.0 0 1 1 51.54 38.11L49.82 40.08Z" fill="#111111"/>

  <!-- energy -->
  <g fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round">
    <path d="M12.6 15.4 9.8 12.8"/>
    <path d="M8.4 22.2 4.8 21.4"/>
    <path d="M51.4 20 55 19.2"/>
    <path d="M50 44 53.2 46.6"/>
  </g>
</svg>
